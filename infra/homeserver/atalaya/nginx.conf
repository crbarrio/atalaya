# Included inside nginx's http{} block (conf.d/*.conf).
#
# Runs under network_mode: host (see infra/docker-compose.yml), so this is
# nginx's own real bind on the host — loopback only, same discipline as the
# backend, Prometheus and Alertmanager. `tailscale serve` is configured
# separately, on the host, to proxy the tailnet's 443 to this port.

# Traefik-style X-Forwarded-Proto is not in play here — there is no reverse
# proxy in front except `tailscale serve`, which does not set it — but the
# fallback keeps this file identical in shape to the rest of the fleet's.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 127.0.0.1:4200;
    server_name _;

    root /usr/share/nginx/html;

    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API → backend, over the host's loopback: network_mode: host means
    # there is no Docker-internal DNS name to resolve, just atalaya's own bind.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        # Identity comes from this header, injected by `tailscale serve`. It is
        # forwarded verbatim; the backend decides whether to trust it, and only
        # does so while listening on loopback.
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;

        # Phase 3 streams command output over SSE. Buffering would hold the
        # response until the command finished, which defeats the point of live
        # output.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # ── Hashed static assets: long cache
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA. No locale prefixes: atalaya is English-only by decision.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
