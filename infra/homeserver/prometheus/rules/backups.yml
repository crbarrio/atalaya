# Backup rules.
#
# These exist because of a real incident: `marsella-test` went a day without a
# backup and it was found only by opening the status file by hand. The cron
# discards its output, so a broken backup is silent by construction — the whole
# point of publishing the result as a metric is that silence stops being an
# answer.

groups:
  - name: backups
    rules:
      - alert: BackupFailed
        expr: stack_backup_success == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.server }}: the last {{ $labels.mode }} backup failed"
          description: >-
            Check backups/last_status on {{ $labels.server }} for the reason. The
            timestamp of the last good backup is deliberately left untouched by a
            failure, so NoRecentBackup still tells the truth.

      # 26 hours, not 24: the cron runs at 02:01 and a run takes minutes, so a
      # threshold of exactly a day would fire on jitter alone.
      #
      # `max by (server)` over BOTH modes, not `mode="incremental"`. The cron
      # runs `full` on the 1st and `incremental` on 2-31 — the full REPLACES
      # that night's incremental rather than joining it. Keyed to the
      # incremental series alone this fired on every server every month, on the
      # 1st, about a machine whose data had just been backed up more completely
      # than an incremental would have. A full is not a missing incremental.
      - alert: NoRecentBackup
        expr: >-
          time() - max by (server) (stack_backup_last_success_timestamp_seconds)
          > 26 * 3600
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.server }}: no good backup of any kind for over a day"
          description: >-
            This is the one that catches a cron that stopped firing, which no
            amount of watching the backup output would reveal. NoRecentFullBackup
            still watches the monthly one separately: a chain of dailies on an
            ageing base is a different failure, and this rule would not see it.

      # Full backups run on the 1st, so anything past 40 days means a monthly
      # run was missed entirely. A server that has never had one publishes a
      # timestamp of 0 and so fires immediately, which is the intended reading:
      # "no good full backup" is truer of never than of 41 days ago.
      - alert: NoRecentFullBackup
        expr: >-
          time() - stack_backup_last_success_timestamp_seconds{mode="full"}
          > 40 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.server }}: no good full backup for over 40 days"
          description: >-
            The incremental chain hangs off the monthly full one, so this also
            means the dailies are building on an increasingly old base.
