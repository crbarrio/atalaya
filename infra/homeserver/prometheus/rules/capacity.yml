# Capacity rules.
#
# The point of these is not to report that a disk is full — by then it is too
# late and something already broke. It is to say how many days are left, while
# there is still time to act. That is what `predict_linear` buys.

groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.server }} is not responding"
          description: >-
            Prometheus has not been able to scrape {{ $labels.instance }} for 10 minutes.
            Either the collector died or the server is unreachable over the tailnet.

  # Root only, matching what the panel shows. Secondary mounts are a different
  # question with different thresholds: homeserver's Prometheus disk sits near
  # 88% by its own retention cap, and its downloads disk fills and empties.
  - name: disk
    rules:
      # Extrapolates the last 6 h of free space forward 4 days. Firing means
      # "at the current rate, this fills over the weekend".
      - alert: DiskWillFillIn4Days
        expr: >-
          predict_linear(
            node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs|ramfs"}[6h],
            4 * 24 * 3600
          ) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.server }}: {{ $labels.mountpoint }} fills within 4 days"
          description: >-
            At the rate of the last 6 hours, {{ $labels.mountpoint }} on
            {{ $labels.server }} runs out of space in under 4 days.
            Currently {{ $value | humanize1024 }}B free.

      # The blunt backstop, for when growth is sudden rather than gradual and
      # the projection has not caught up.
      - alert: DiskAlmostFull
        expr: >-
          node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs|ramfs"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs|ramfs"}
          < 0.10
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.server }}: {{ $labels.mountpoint }} under 10% free"

  - name: memory
    rules:
      - alert: MemoryWillExhaustIn24h
        expr: >-
          predict_linear(node_memory_MemAvailable_bytes[6h], 24 * 3600) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.server }}: RAM exhausted within 24 hours"
          description: >-
            At the rate of the last 6 hours, {{ $labels.server }} runs out of
            available memory in under a day. This is the signal that a server is
            at capacity and no more clients fit.

      - alert: MemoryAlmostExhausted
        expr: >-
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.server }}: under 10% RAM available"
